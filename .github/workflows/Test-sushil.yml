name: Manual CI Pipeline (Multi-Branch)

on:
  workflow_dispatch:  # Enables manual trigger from any branch via GitHub UI

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from triggered branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # Ensures correct branch is checked out when triggered manually

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Deploy (mock)
        run: echo "Deploying application..."
